name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configure git author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/Migration4Dataverse.Dashboard/package-lock.json

      - name: Restore .NET dependencies
        run: dotnet restore Migration4Dataverse.slnx --locked-mode

      - name: Build .NET solution
        run: dotnet build Migration4Dataverse.slnx --configuration Release --no-restore

      - name: Cache PowerShell modules
        uses: actions/cache@v4
        with:
          path: ~/.local/share/powershell/Modules
          key: psmodules-${{ runner.os }}-psresourceget-1.2.0-rnwood-3.3.0

      - name: Install PowerShell modules
        shell: pwsh
        run: |
          Install-Module Microsoft.PowerShell.PSResourceGet -MinimumVersion 1.2.0 -Force -AllowClobber -Scope CurrentUser
          Install-Module Rnwood.Dataverse.Data.PowerShell -RequiredVersion 3.3.0 -Force -Scope CurrentUser

      - name: Install release tooling
        run: npm ci

      - name: Check release baseline
        id: release-baseline
        shell: pwsh
        run: |
          if (git tag --list 'v0.1.0') {
              'ready=true' >> $env:GITHUB_OUTPUT
          }
          else {
              'ready=false' >> $env:GITHUB_OUTPUT
              Write-Warning 'Skipping automated release until the v0.1.0 baseline tag exists.'
          }

      - name: Publish release
        if: steps.release-baseline.outputs.ready == 'true'
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
